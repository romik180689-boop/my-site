<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Для Милены ❤️</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;600;800&family=Playfair+Display:ital,wght@1,600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body class="milena-page">
    <div class="glow glow-1" style="background: #ff416c;"></div>
    <div class="glow glow-2" style="background: #ff4b2b;"></div>

    <div class="container secret-container">
        <h1 class="secret-title fade-in">Для тебя, Милена</h1>
        
        <div class="glass-card fade-in" style="text-align: center; margin-top: 30px;">
            <p style="font-size: 22px; font-family: 'Playfair Display', serif; font-style: italic; color: #ff8a00;">
                "Ты — самое лучшее, что случилось со мной."
            </p>
            <p style="margin-top: 20px; color: #c0c0d0;">
                Спасибо, что ты рядом. Этот сайт — маленький кусочек моего мира, и я хочу, чтобы ты была в нём.
            </p>
        </div>

        <!-- СЧЕТЧИК ДНЕЙ -->
        <div class="glass-card fade-in" style="text-align: center; margin-top: 30px; border-color: rgba(255, 65, 108, 0.3);">
            <h3>Мы вместе уже:</h3>
            <div class="counter-number" id="days-counter" style="font-size: 70px; font-weight: 800; background: linear-gradient(135deg, #ff416c, #ff4b2b); -webkit-background-clip: text; -webkit-text-fill-color: transparent; line-height: 1.2; margin: 10px 0;">0</div>
            <p style="color: #a0a0b5;">дней счастья</p>
        </div>

        <div style="text-align: center; margin-top: 40px;" class="fade-in">
            <a href="/" class="btn">Вернуться на главную</a>
        </div>
    </div>

    <!-- Скрипт для подсчета дней -->
    <script>
        // ВАЖНО: Укажи здесь вашу дату (год, месяц-1, день)
        // Месяцы считаются с 0! То есть 10 - это ноябрь, 9 - это октябрь.
        // Пример: 11 ноября 2025 года -> new Date(2025, 10, 11)
        const startDate = new Date(2025, 10, 11); 
        
        const today = new Date();
        const diffTime = Math.abs(today - startDate);
        const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24)); 
        
        document.getElementById('days-counter').innerText = diffDays;
    </script>
</body>
</html>
