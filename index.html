<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FUTURE // СИСТЕМА</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;800&display=swap');

        :root {
            --primary: #00f2fe;
            --secondary: #4facfe;
            --bg: #050510;
            --glass: rgba(255, 255, 255, 0.03);
            --border: rgba(255, 255, 255, 0.1);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; cursor: crosshair; }

        body {
            background-color: var(--bg);
            color: #fff;
            font-family: 'Montserrat', sans-serif;
            overflow: hidden;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            perspective: 1000px;
        }

        .stars {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle, rgba(255,255,255,0.8) 1px, transparent 1px);
            background-size: 50px 50px;
            animation: moveStars 100s linear infinite;
            opacity: 0.3;
            z-index: 0;
        }

        @keyframes moveStars { from { background-position: 0 0; } to { background-position: 0 2000px; } }

        .container {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 800px;
            padding: 40px;
            transform-style: preserve-3d;
            transition: transform 0.1s ease;
        }

        .glass-card {
            background: var(--glass);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--border);
            border-radius: 30px;
            padding: 60px;
            text-align: center;
            box-shadow: 0 25px 50px rgba(0,0,0,0.5);
            transform-style: preserve-3d;
            position: relative;
            overflow: hidden;
        }

        .glass-card::before {
            content: '';
            position: absolute;
            top: -50%; left: -50%;
            width: 200%; height: 200%;
            background: radial-gradient(circle, rgba(0, 242, 254, 0.1) 0%, transparent 60%);
            animation: rotate 10s linear infinite;
            z-index: -1;
        }

        @keyframes rotate { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }

        h1 {
            font-size: 56px;
            font-weight: 800;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: 5px;
            transform: translateZ(50px);
            text-shadow: 0 0 20px rgba(0, 242, 254, 0.3);
        }

        p {
            color: #a0a0b5;
            font-size: 18px;
            margin-bottom: 40px;
            transform: translateZ(30px);
        }

        .btn {
            display: inline-block;
            padding: 15px 40px;
            background: transparent;
            color: var(--primary);
            border: 2px solid var(--primary);
            border-radius: 50px;
            font-size: 18px;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 2px;
            cursor: pointer;
            transition: all 0.3s;
            transform: translateZ(40px);
            text-decoration: none;
        }

        .btn:hover {
            background: var(--primary);
            color: #000;
            box-shadow: 0 0 30px var(--primary);
        }

        .orbit {
            position: absolute;
            border-radius: 50%;
            border: 1px solid rgba(0, 242, 254, 0.2);
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            pointer-events: none;
        }

        .orbit-1 { width: 400px; height: 400px; animation: spin 20s linear infinite; }
        .orbit-2 { width: 600px; height: 600px; animation: spin 30s linear infinite reverse; }

        @keyframes spin {
            from { transform: translate(-50%, -50%) rotate(0deg); }
            to { transform: translate(-50%, -50%) rotate(360deg); }
        }

        .dot {
            position: absolute;
            width: 10px; height: 10px;
            background: var(--primary);
            border-radius: 50%;
            box-shadow: 0 0 15px var(--primary);
            top: 0; left: 50%;
            transform: translateX(-50%);
        }
    </style>
</head>
<body>
    <div class="stars"></div>

    <div class="orbit orbit-1"><div class="dot"></div></div>
    <div class="orbit orbit-2"><div class="dot"></div></div>

    <div class="container" id="container">
        <div class="glass-card">
            <h1>SYSTEM</h1>
            <p>Инициализация завершена. Добро пожаловать в будущее.</p>
            <a href="universe.html" class="btn">Войти</a>
        </div>
    </div>

    <script>
        const container = document.getElementById('container');
        const card = document.querySelector('.glass-card');

        document.addEventListener('mousemove', (e) => {
            const xAxis = (window.innerWidth / 2 - e.pageX) / 25;
            const yAxis = (window.innerHeight / 2 - e.pageY) / 25;
            
            container.style.transform = `rotateY(${xAxis}deg) rotateX(${yAxis}deg)`;
            card.style.transform = `rotateY(${xAxis}deg) rotateX(${yAxis}deg)`;
        });

        document.addEventListener('mouseleave', () => {
            container.style.transform = `rotateY(0deg) rotateX(0deg)`;
            container.style.transition = "transform 0.5s ease";
            card.style.transform = `rotateY(0deg) rotateX(0deg)`;
            card.style.transition = "transform 0.5s ease";
        });
    </script>
</body>
</html>
